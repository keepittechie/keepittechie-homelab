# Sanitized NGINX reverse proxy example.
# This is a teaching template, not a production-ready config.

server {
    listen 80;
    server_name app.home.example.com;

    # Redirect cleartext HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.home.example.com;

    # Placeholder certificate paths. Do not commit real private keys.
    ssl_certificate /etc/local-ca/example/app.home.example.com.crt;
    ssl_certificate_key /etc/local-ca/example/app.home.example.com.key;

    # Keep TLS settings in a private, reviewed include if used in production.
    # include /etc/nginx/snippets/example-tls-settings.conf;

    location / {
        proxy_pass http://app.internal.example:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for apps that need upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
