# Sanitized Prometheus scrape config example.
# Keep real targets, credentials, and alert destinations private.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus.home.example.com:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node1.home.example.com:9100"
          - "node2.home.example.com:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "docker1.home.example.com:8080"

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://grafana.home.example.com"
          - "https://dashboard.home.example.com"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox.home.example.com:9115"

  - job_name: "proxmox-exporter"
    static_configs:
      - targets:
          - "proxmox.home.example.com:9221"
