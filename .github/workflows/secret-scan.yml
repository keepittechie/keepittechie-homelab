name: Basic Secret Scan

on:
  pull_request:
  push:

jobs:
  secret-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for obvious secret patterns
        run: |
          if grep -RInE "PRIVATE KEY|password=|api_key=|secret=|token=" . --exclude-dir=.git --exclude=".env.example"; then
            echo "Potential secret found. Review before merging."
            exit 1
          fi
