name: Basic Secret Scan

on:
  pull_request:
  push:

jobs:
  secret-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for obvious secret patterns
        run: |
          pattern='PRIVATE'' KEY|password''=|api_''key=|secret''=|token''=|cloud''flared|Tunnel''Secret|BEGIN'' RSA|BEGIN'' OPENSSH'
          if grep -RInE "$pattern" . \
            --exclude-dir=.git \
            --exclude=".env.example" \
            --exclude="*.env.example" \
            --exclude=".github/workflows/secret-scan.yml"; then
            echo "Potential secret found. Review before merging."
            exit 1
          fi
